# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven


#
# Notes:
# - we need to install pypandoc first as it is needed by pyspark setup
# - using python 3.7 because platform specific wheel for pandas 0.23.x required
#   by hail is not available for python 3.8
#

name: Publish Release

on:
  push:
    tags:
      - 'v**'
jobs:
  deploy-maven:
    name: Build and deploy to Maven Central
    runs-on: ubuntu-22.04
    environment:
      name: deploy
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: 3.7
      - name: Cache Python packages
        uses: actions/cache@v4
        id: pythoncache
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dev/dev-requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache dir
          pip install pypandoc==1.5 setuptools wheel
          if [ -f dev/dev-requirements.txt ]; then pip install -r dev/dev-requirements.txt; fi
      - name: Install GPG key
        run: |
          cat <(echo -e "${{ secrets.GPG_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: Configure Maven settings
        uses: s4u/maven-settings-action@v2.6.0
        with:
          servers: |
            [{
              "id": "central",
              "username": "${{ secrets.CENTRAL_TOKEN_USERNAME }}",
              "password": "${{ secrets.CENTRAL_TOKEN_PASSWORD }}"
            }]
      - name: Build with Maven
        run: |
          mvn -Prelease -DskipTests=true -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" \
          --batch-mode --file pom.xml \
          deploy
      - name: Build python package
        run: |
          cd python
          python setup.py sdist bdist_wheel
      - name: Store the python package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
  deploy-pypi:
    name: Deploy to PyPI
    needs:
      - deploy-maven
    runs-on: ubuntu-22.04
    environment:
      name: deploy
      url: https://pypi.org/p/variant-spark
    permissions:
      id-token: write
    steps:
      - name: Load the python package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
  create-release:
    name: Draft GitHub release
    runs-on: ubuntu-22.04
    environment:
      name: deploy
    needs: [ deploy-pypi]
    steps:
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: true
          prerelease: true
